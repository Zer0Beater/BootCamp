<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <body>
       <h1>Marathon Test</h1>
       <form>
            <div>
                <div>
                    <label for="FirstName">Input your First Name: </label>
                    <input type="text" placeholder="First Name" required id="FirstName" name="FirstName">
                </div>
                <div>
                    <label for="Last Name">Input your Last Name: </label>
                    <input type="text" placeholder="Last Name" required id="LastName" name="Lastname">
                </div>
                <div>
                    <label for="Email">Input your Email: </label>
                    <input type="email" placeholder="Email" required id="Email" name="Email">
                </div>
                <div>
                    <label for="Password">Input your Password: </label>
                    <input type="password" placeholder="Password" required id="Password" name="Password">
                </div>
                <div>
                    <label for="Age">Your age bracket: </label>
                    <select id="Age" name="Age" required>
                        <option value="Nan" disabled selected>Choose your age</option>
                        <option value="0-5">0-5</option>
                        <option value="5-10">5-10</option>
                        <option value="10-15">10-15</option>
                        <option value="15-20">15-20</option>
                        <option value="20-25">20-25</option>
                        <option value="25-30">25-30</option>
                    </select>
                </div>
            </div>
            <div>
                <div>
                    <label for="Race1">Fun Run 5k: </label>
                    <input type="radio" required id="Race1" name="Race" value="FunRun">
                </div>
                <div>
                    <label for="Race2">Half Marathon </label>
                    <input type="radio" required id="Race2" name="Race" value="Half_Marathon">
                </div>
                <div>
                    <label for="Race3">Full Marathon </label>
                    <input type="radio" required id="Race3" name="Race" value="Full_Marathon">
                </div>
            </div>
            <button type="submit">Register for a race</button>
       </form>
    </body>
</html>
